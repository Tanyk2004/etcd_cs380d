global:
  scrape_interval: 1s      # Fast scrape for observing transient events
  evaluation_interval: 1s

scrape_configs:
  - job_name: "etcd"
    # Update these targets to match your etcd cluster endpoints.
    # Each etcd node exposes metrics on its client URL at /metrics.
    static_configs:
      - targets:
          - "127.0.0.1:9101"
          - "127.0.0.1:9102"
          - "127.0.0.1:9103"
        labels:
          cluster: "test"
    metrics_path: /metrics

  - job_name: "tc"
    # tc-exporter: exposes tc qdisc stats for the loopback interface.
    # Metrics: tc_qdisc_drops_total, tc_qdisc_overlimits_total,
    #          tc_qdisc_backlog_bytes, tc_qdisc_backlog_packets
    # Started by run_test_suite.sh; safe to scrape even when no tbf cap is active.
    static_configs:
      - targets:
          - "127.0.0.1:9105"
        labels:
          cluster: "test"
    metrics_path: /metrics
