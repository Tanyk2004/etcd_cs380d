# Prometheus + Grafana stack for etcd Raft observability.
# Usage:
#   1. Update prometheus.yml with your etcd node endpoints
#   2. docker compose up -d
#   3. Open Grafana at http://localhost:3000 (admin/admin)
#   4. The "etcd Raft Observability" dashboard is auto-provisioned

services:
  prometheus:
    image: prom/prometheus:v2.51.0
    network_mode: host
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=1h"
      - "--web.listen-address=:9090"
      - "--web.enable-lifecycle"   # allows POST /-/reload to hot-reload config

  grafana:
    image: grafana/grafana:10.4.1
    network_mode: host
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SERVER_HTTP_PORT=3000
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
